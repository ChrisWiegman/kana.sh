title = "Kana Theme"
baseURL = "https://kana.sh"
theme = "kana-hugo-theme"
locale = "en-us"
timeout = "90s"
disableHugoGeneratorInject = true
enableRobotsTXT = true
enableGitInfo = true
canonifyURLs = true
disableKinds = ["taxonomy"]

[build.cleanDestinationDir]
enable = true

[params]
author = "Chris Wiegman"
mainSections = ["posts"]
OpenGraph = true
TwitterCards = false
jsonld = true
MobileWebAppTitle = "Kana"
description = "A warm, earthy theme for your website, editor or terminal."
policies = "/policies"
headerIcon = "images/logo.png"

[params.robots]
blockAgents = ["CCBot"]

[params.robots.contentSignals]
search = true
ai-input = true
ai-train = false

[params.agentSkills]
markdownNegotiation = true

[params.license]
name = "Creative Commons Licensed"
title = "Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0) license"
link = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

[imaging]
resampleFilter = "lanczos"

[imaging.jpeg]
quality = 90
[imaging.webp]
quality = 90
hint = "drawing"
[imaging.avif]
quality = 90

[minify]
minifyOutput = true

[pagination]
pagerSize = 25

[html]
keepDefaultAttrVals = false
keepDocumentTags = false
keepEndTags = false
keepSpecialComments = false

[[menus.main]]
name = "VS Code"
title = "The Kana VS Code theme"
pageRef = "/vscode"
weight = 10

[[menus.main]]
name = "Terminal"
title = "The Kana Mac Terminal theme"
pageRef = "/terminal"
weight = 20

[[menus.main]]
name = "Hugo"
title = "The Kana Hugo theme"
pageRef = "/hugo"
weight = 30

[[menus.main]]
name = "Xcode"
title = "The Kana Xcode theme"
pageRef = "/xcode"
weight = 40

[[menus.main]]
name = "Contact"
title = "Reach me via email"
url = "mailto:contact@kana.sh"
weight = 50

[[menus.footer]]
name = "VS Code"
title = "The Kana VS Code theme"
pageRef = "/vscode"
weight = 10

[[menus.footer]]
name = "Terminal"
title = "The Kana Mac Terminal theme"
pageRef = "/terminal"
weight = 15

[[menus.footer]]
name = "Hugo"
title = "The Kana Hugo theme"
pageRef = "/hugo"
weight = 20

[[menus.footer]]
name = "Xcode"
title = "The Kana Xcode theme"
pageRef = "/xcode"
weight = 30

[permalinks]
posts = "/:year/:month/:slug/"

[services.rss]
limit = 30

[outputs]
home = ["HTML", "RSS", "JSON", "markdown", "llms", "llmsfull", "agentskills"]
page = ["HTML", "markdown"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]

[security]
  allowContent = ['.*']

[markup.highlight]
noClasses = false

[markup.goldmark.parser.attribute]
block = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks.image]
useEmbedded = "fallback"

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"
