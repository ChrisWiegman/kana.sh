name: Deploy to Cloudflare Workers

env:
  SITE_TITLE: "Kana Theme"
  SITE_URL: "https://kana.sh/"
  RSS_URL: "https://kana.sh/index.xml"


on:
    push:
        branches: [main]
        paths-ignore:
            - "content/drafts/**"
            - ".vscode/**"
            - "scripts/**"
            - ".github/**"
            - "Makefile"
            - "package.json"
            - "package-lock.json"
            - "README.md"
            - ".gitignore"
            - ".gitmodules"
            - ".githooks/**"
            - "lychee.toml"
    workflow_dispatch: {}
    workflow_call:
        inputs:
            ref:
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  submodules: true
                  fetch-depth: 2

            - name: Set up dependencies and build Hugo site
              uses: ./.github/actions/setup-deps
              with:
                  build-site: "true"

            - name: Deploy to Cloudflare Workers
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    ping:
        needs: deploy
        uses: ./.github/workflows/ping.yml
        secrets: inherit
