name: Deploy to Cloudflare Workers

env:
  SITE_TITLE: "KAna Theme"
  SITE_URL: "https://kana.sh/"
  RSS_URL: "https://kana.sh/index.xml"


on:
    push:
        branches: [main]
        paths-ignore:
            - "content/drafts/**"
            - ".vscode/**"
            - "scripts/**"
            - ".github/**"
            - "Makefile"
            - "package.json"
            - "package-lock.json"
            - "README.md"
            - ".gitignore"
            - "/gitmodules"
            - ".devcontainer/**"
            - ".frontmatter/**"
    workflow_dispatch: {}
    workflow_call:
        inputs:
            ref:
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  submodules: true
                  fetch-depth: 2

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: "lts/*"
                cache: "npm"

            - name: Install dependencies
              shell: bash
              run: npm ci ${{ inputs.include-optional == 'true' && '--include=optional' || '' }}

            # Installs Hugo
            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                hugo-version: 'latest'
                extended: true

            - name: Cache Hugo resources
              uses: actions/cache@v5
              with:
                  path: |
                      resources
                  key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/go.mod', '**/go.sum', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', 'hugo.toml', 'hugo.yaml', 'hugo.json', 'config/**', 'assets/**') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-resources-

            # Hugo's resources/ (processed images, bundles) and its module/build
            # cache (.hugo_cache) are cheap to share across runs but expensive to
            # rebuild from scratch, so both are restored from one cache entry
            # keyed on everything that can change the build output.
            - name: Cache Hugo build artifacts
              uses: actions/cache@v6
              with:
                path: |
                  resources
                  .hugo_cache
                key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.mod', '**/go.sum', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', 'hugo.toml', 'hugo.yaml', 'hugo.json', 'config/**', 'assets/**') }}
                restore-keys: |
                  ${{ runner.os }}-hugo-

            - name: Build site
              shell: bash
              run: hugo --gc --minify --cacheDir "${{ github.workspace }}/.hugo_cache"

            - name: Deploy to Cloudflare Workers
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    ping:
        needs: deploy
        uses: ./.github/workflows/ping.yml
        secrets: inherit
