name: Ping update services

env:
  SITE_TITLE: "The Kana Theme"
  SITE_URL: "https://kana.sh/"
  RSS_URL: "https://kana.sh/index.xml"

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Ping-O-Matic
        run: |
          curl -sS -X POST "https://pingomatic.com/ping/" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "title=${{ env.SITE_TITLE }}" \
            --data-urlencode "blogurl=${{ env.SITE_URL }}" \
            --data-urlencode "rssurl=${{ env.RSS_URL }}" \
            --data-urlencode "chk_blogs=on" \
            --data-urlencode "chk_feedburner=on" \
            --data-urlencode "chk_newsgator=on" \
            --data-urlencode "chk_myyahoo=on"

      - name: Ping PubSubHubbub
        env:
          HUB_URL: https://pubsubhubbub.appspot.com/
        run: |
          curl -sS -X POST "$HUB_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=${{ env.SITE_URL }}" \
            -o /dev/null -w "PubSubHubbub HTTP %{http_code}\n"

      - name: Checkout
        uses: actions/checkout@v7
        with:
            submodules: true
            fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci ${{ inputs.include-optional == 'true' && '--include=optional' || '' }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Hugo's resources/ (processed images, bundles) and its module/build
      # cache (.hugo_cache) are cheap to share across runs but expensive to
      # rebuild from scratch, so both are restored from one cache entry
      # keyed on everything that can change the build output.
      - name: Cache Hugo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            resources
            .hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.mod', '**/go.sum', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', 'hugo.toml', 'hugo.yaml', 'hugo.json', 'config/**', 'assets/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Add node_modules/.bin to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build site
        shell: bash
        run: hugo --gc --minify --cacheDir "${{ github.workspace }}/.hugo_cache"

      - name: Build IndexNow payload from most recently edited posts
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_HOST: "kana.sh"
          SITE_BASE: "https://kana.sh"
          MAX_URLS: "50"
        run: |
          set -euo pipefail

          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "Missing secrets.INDEXNOW_KEY"
            exit 1
          fi

          # Ask Hugo for every page's real, rendered permalink instead of
          # reimplementing its title-to-slug rules (which have surprising
          # edge cases -- apostrophes are dropped, dots are kept, etc.) --
          # a from-scratch slugifier drifts out of sync with Hugo's own.
          hugo list all > hugo-pages.csv

          python3 - <<'PY' > indexnow.json
          import csv, os, json, subprocess
          from datetime import datetime

          site_base = os.environ["SITE_BASE"].rstrip("/")
          site_host = os.environ["SITE_HOST"]
          key = os.environ["INDEXNOW_KEY"]
          max_urls = int(os.environ.get("MAX_URLS", "50"))

          def git_last_commit_iso(path: str) -> str | None:
            try:
              return subprocess.check_output(
                ["git", "log", "-1", "--format=%cI", "--", path],
                text=True,
              ).strip() or None
            except Exception:
              return None

          # Collect posts with their *commit* datetime (for "most recently
          # edited" ordering) and their Hugo-computed permalink.
          posts: list[tuple[datetime, str]] = []
          with open("hugo-pages.csv", newline="", encoding="utf-8") as f:
            for row in csv.DictReader(f):
              path = row.get("path", "")
              permalink = row.get("permalink", "")
              if not path.startswith("content/posts/") or not permalink:
                continue
              if row.get("draft", "false").lower() == "true":
                continue
              iso = git_last_commit_iso(path)
              if not iso:
                continue
              try:
                commit_dt = datetime.fromisoformat(iso)
              except ValueError:
                continue
              posts.append((commit_dt, permalink))

          posts.sort(key=lambda x: x[0], reverse=True)
          urls = [permalink for _, permalink in posts[:max_urls]]

          # Always include key site URLs
          urls.extend([
            f"{site_base}/",
            f"{site_base}/index.xml",
            f"{site_base}/sitemap.xml",
          ])

          # de-dupe preserve order
          seen = set()
          deduped = []
          for u in urls:
            if u not in seen:
              seen.add(u)
              deduped.append(u)

          payload = {
            "host": site_host,
            "key": key,
            "keyLocation": f"{site_base}/indexnow.key",
            "urlList": deduped,
          }

          print(json.dumps(payload, indent=2))
          PY

      - name: Submit URLs to IndexNow
        run: |
          set -euo pipefail
          echo "Submitting the following payload:"
          cat indexnow.json
          echo ""
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n"
